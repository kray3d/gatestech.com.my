name: Deploy to Live Server via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_slate:
        description: "Wipe server files first (removes anything not in this repo, e.g. injected/hacked files)"
        type: boolean
        default: false

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          dangerous-clean-slate: ${{ inputs.clean_slate == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            *.md
            .gitignore
